<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>App Home Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary-red": "#E60012",
                        "deep-red": "#BC002D",
                        "background-light": "#FFFFFF",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "2rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            min-height: max(844px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light font-display min-h-screen flex flex-col overflow-hidden relative">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-primary-red/5 rounded-full blur-3xl -z-10"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[280px] h-[280px] border border-primary-red/10 rounded-full -z-10"></div>
<header class="flex items-center p-6 justify-between z-10">
<div class="w-10"></div> 
<div class="flex-1 text-center">
<span class="text-xs font-bold tracking-[0.3em] uppercase text-primary-red/40 block mb-1">Currency</span>
</div>
<button class="w-10 h-10 flex items-center justify-center text-gray-400">
<span class="material-symbols-outlined">account_circle</span>
</button>
</header>
<main class="flex-1 px-8 flex flex-col items-center justify-between py-12 z-10">
<div class="w-full text-center mt-4">
<h1 class="text-primary-red text-5xl font-extrabold tracking-tight mb-2">Welcome</h1>
<p class="text-gray-500 font-medium">Ready to travel?</p>
</div>
<div class="w-full max-w-sm">
<div class="bg-white/80 backdrop-blur-md border border-gray-100 rounded-2xl shadow-xl p-8 flex flex-col gap-6">
<div class="flex justify-between items-center">
<div class="flex flex-col">
<span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Live Rate</span>
<div class="flex items-center gap-2">
<span class="text-xl font-bold text-gray-800">1 PHP</span>
<span class="material-symbols-outlined text-primary-red text-sm">trending_flat</span>
<span class="text-xl font-bold text-gray-800">2.61 JPY</span>
</div>
</div>
<div class="w-12 h-12 bg-primary-red/10 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary-red">analytics</span>
</div>
</div>
<div class="h-[1px] w-full bg-gray-100"></div>
<div class="flex justify-between items-end">
<div>
<p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Last Update</p>
<p class="text-xs text-gray-600">Today, 10:45 AM</p>
</div>
<div class="flex -space-x-2">
<div class="w-8 h-8 rounded-full border-2 border-white bg-blue-600 flex items-center justify-center text-[10px] text-white font-bold">PH</div>
<div class="w-8 h-8 rounded-full border-2 border-white bg-white flex items-center justify-center overflow-hidden border border-gray-100">
<div class="w-3 h-3 bg-primary-red rounded-full"></div>
</div>
</div>
</div>
</div>
</div>
<div class="w-full max-w-sm flex flex-col gap-6">
<button class="w-full py-5 rounded-2xl bg-gradient-to-r from-primary-red to-deep-red text-white text-lg font-bold shadow-2xl shadow-primary-red/30 active:scale-95 transition-transform flex items-center justify-center gap-3">
<span>Start Converting</span>
<span class="material-symbols-outlined font-bold">arrow_forward_ios</span>
</button>
<div class="flex justify-center gap-8 text-gray-400">
<button class="flex flex-col items-center gap-1">
<span class="material-symbols-outlined">history</span>
<span class="text-[10px] font-bold uppercase tracking-tighter">History</span>
</button>
<button class="flex flex-col items-center gap-1">
<span class="material-symbols-outlined">settings</span>
<span class="text-[10px] font-bold uppercase tracking-tighter">Settings</span>
</button>
</div>
</div>
</main>
<div class="flex justify-center pb-2">
<div class="w-32 h-1.5 bg-gray-200 rounded-full"></div>
</div>

</body></html>
